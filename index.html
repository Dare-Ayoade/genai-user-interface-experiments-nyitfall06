<html>
    <head>
        <title>UI Experiments</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body class="page">

        <h1 class="page-title">
            UI Font Experiments
        </h1>

        <div class="button-wrapper">

            <!-- Surreal button -->
            <button
                class="surreal-button"
                onmouseover="
                    this.style.transform='rotate(2deg) scale(1.08) skewX(-2deg)';
                    this.style.borderRadius='55% 45% 60% 40% / 45% 55% 42% 58%';
                    this.style.boxShadow='12px 18px 0 rgba(32,20,12,.45), 25px 35px 45px rgba(0,0,0,.5), inset 5px 6px 12px rgba(255,230,160,.35)';
                    this.style.filter='sepia(1.15) brightness(1.12)';
                "

                onmouseout="
                    this.style.transform='rotate(-2deg) scale(1)';
                    this.style.borderRadius='48% 52% 45% 55% / 55% 45% 58% 42%';
                    this.style.boxShadow='8px 12px 0 rgba(32,20,12,.55), 18px 25px 35px rgba(0,0,0,.45), inset 4px 5px 10px rgba(255,230,160,.3), inset -8px -8px 15px rgba(20,10,5,.35)';
                    this.style.filter='none';
                "

                onmousedown="
                    this.style.transform='rotate(1deg) scale(.96) skewX(2deg)';
                "

                onmouseup="
                    this.style.transform='rotate(2deg) scale(1.08) skewX(-2deg)';
                "
            >
                CLICK ME
            </button>

            <!-- Floating surreal "clock" -->
            <div class="floating-clock"></div>

        </div>

    </body>
</html>
