<html>
    <head>
        <title>UI Experiments</title>
    </head>

    <body style="
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle at 20% 30%, rgba(255, 210, 120, 0.18), transparent 25%),
            linear-gradient(135deg, #17120f, #49382b 55%, #16120f);
        font-family: Georgia, serif;
        color: #f5dfb3;
    ">

        <h1 style="
            margin-bottom: 45px;
            font-size: 34px;
            font-weight: 400;
            letter-spacing: 2px;
            text-shadow: 0 3px 15px rgba(0,0,0,0.5);
        ">
            UI Font Experiments
        </h1>

        <div style="
            position: relative;
            padding: 25px;
        ">

            <!-- Surreal button -->
            <button
                style="
                    position: relative;
                    padding: 22px 48px;
                    border: 2px solid #d8b56d;
                    border-radius: 48% 52% 45% 55% / 55% 45% 58% 42%;
                    background:
                        radial-gradient(circle at 30% 25%, #f5d58b, transparent 22%),
                        linear-gradient(145deg, #a8783d, #6e4827 55%, #3c281b);
                    color: #fff1c9;
                    font-family: Georgia, serif;
                    font-size: 17px;
                    font-weight: bold;
                    letter-spacing: 3px;
                    cursor: pointer;

                    /* Strange, dreamlike shadow */
                    box-shadow:
                        8px 12px 0 rgba(32, 20, 12, 0.55),
                        18px 25px 35px rgba(0, 0, 0, 0.45),
                        inset 4px 5px 10px rgba(255, 230, 160, 0.3),
                        inset -8px -8px 15px rgba(20, 10, 5, 0.35);

                    transform: rotate(-2deg);
                    transition:
                        transform 0.4s ease,
                        border-radius 0.5s ease,
                        box-shadow 0.4s ease,
                        filter 0.4s ease;
                "

                onmouseover="
                    this.style.transform='rotate(2deg) scale(1.08) skewX(-2deg)';
                    this.style.borderRadius='55% 45% 60% 40% / 45% 55% 42% 58%';
                    this.style.boxShadow='12px 18px 0 rgba(32,20,12,.45), 25px 35px 45px rgba(0,0,0,.5), inset 5px 6px 12px rgba(255,230,160,.35)';
                    this.style.filter='sepia(1.15) brightness(1.12)';
                "

                onmouseout="
                    this.style.transform='rotate(-2deg) scale(1)';
                    this.style.borderRadius='48% 52% 45% 55% / 55% 45% 58% 42%';
                    this.style.boxShadow='8px 12px 0 rgba(32,20,12,.55), 18px 25px 35px rgba(0,0,0,.45), inset 4px 5px 10px rgba(255,230,160,.3), inset -8px -8px 15px rgba(20,10,5,.35)';
                    this.style.filter='none';
                "

                onmousedown="
                    this.style.transform='rotate(1deg) scale(.96) skewX(2deg)';
                "

                onmouseup="
                    this.style.transform='rotate(2deg) scale(1.08) skewX(-2deg)';
                "
            >
                CLICK ME
            </button>

            <!-- Floating surreal "clock" -->
            <div style="
                position: absolute;
                width: 48px;
                height: 72px;
                right: -8px;
                top: -25px;
                border-radius: 45% 55% 60% 40%;
                background: linear-gradient(135deg, #e4c27b, #927044);
                opacity: 0.8;
                transform: rotate(18deg);
                box-shadow:
                    4px 8px 15px rgba(0,0,0,.35),
                    inset 3px 3px 7px rgba(255,240,190,.4);
                pointer-events: none;
            "></div>

        </div>

    </body>
</html>
